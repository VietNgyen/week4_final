<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Accessible Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Natural Wonders Showcase</h1>
    <p>Explore stunning landscapes captured from around the globe.</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&auto=format&fit=crop" alt="Sunlight illuminating Yosemite Valley and its surrounding granite cliffs">
      <figcaption>
        <p>Yosemite Valley glows under golden morning light, surrounded by majestic granite peaks.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&auto=format&fit=crop" alt="Morning fog rolling across lush green mountain ridges">
      <figcaption>
        <p>Thick layers of mist drift across quiet pine forests in the mountain ranges.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&auto=format&fit=crop" alt="Sunbeams filtering through the tall trees of a dense woodland">
      <figcaption>
        <p>Sunlight streams through the dense canopy of ancient coastal redwoods.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=800&auto=format&fit=crop" alt="Rugged rocky peaks reflected in a crystal clear alpine lake">
      <figcaption>
        <p>A crystal clear glacial lake perfectly mirrors towering alpine summits.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop" alt="Turquoise waves gently washing onto a pristine sandy beach">
      <figcaption>
        <p>Gentle ocean tides wash over white sand along a peaceful tropical coast.</p>
      </figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Responsive Design Project. All images sourced from Unsplash.</p>
  </footer>

</body>
</html>
